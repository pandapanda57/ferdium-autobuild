name: Electron auto-build

# Rebuilds the newest official Ferdium release on every new Electron version.
# The "line" is the Electron major normal builds use: ELECTRON_LINE below, or the major
# official Ferdium ships with if that is newer.
#   - New patch of the line's Electron major             -> normal release (safe to install)
#   - Electron major newer than the line                 -> one pre-release marked TEST per major
#   - TEST build fails                                   -> issue; that major is not retried
#                                                           while the issue is open (close it to retry)
# Any build on a newer Electron major than Ferdium ships with ("compat" builds) also uses the
# newest node-abi, so electron-builder recognises the new major, and builds Windows x64 only
# (Electron 45+ no longer publishes 32-bit Windows). On Electron 44+ it swaps in
# .github/patches/electron44-clipboard.ts (writeImage removed) and runs an informational
# type-check against that Electron's API.
# Run manually with "rebuild_test" to force a fresh TEST build even if one exists for that major.
#   - Ferdium's Electron major near/at end of support    -> issue in this repo
# Every build also forces patch/minor security updates of 25 shipped npm packages (2026-11-02 audit),
# plus (r2) tar 7, minimatch 3/9, decode-uri-component 0.2, tmp 0.2, and three Ferdium hardening patches:
# tar 7 import, recipe unpacking without preservePaths, and a local-server token check that runs
# before body parsing and routing.
#   - Normal build fails -> issue; that exact build is not retried while the issue is open.
#   - Bump NPM_FIX_REV after changing the override list, to rebuild with the new list.
# Third-party actions are pinned to commit SHAs; the repository only allows these actions
# and requires SHA pinning. To update one, resolve the new tag's commit and change the SHA.
# Installing is always manual: these builds are unsigned.

on:
  schedule:
    - cron: '23 */6 * * *' # every 6 hours
  workflow_dispatch:
    inputs:
      rebuild_test:
        description: 'Build a fresh TEST release on the newest Electron major even if one exists'
        type: boolean
        default: false
      check_only:
        description: 'Install, test, patch and type-check the current normal build; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: electron-autobuild
  cancel-in-progress: false

env:
  NPM_FIX_REV: '2'
  # Electron major for normal builds (user switched to 45 on 2026-11-02 after trialling Chrome 156)
  ELECTRON_LINE: '45'

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      REBUILD_TEST: ${{ github.event.inputs.rebuild_test || 'false' }}
      CHECK_ONLY: ${{ github.event.inputs.check_only || 'false' }}
    steps:
      - name: Work out what needs building
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          FERDIUM_TAG=$(gh api repos/ferdium/ferdium-app/releases/latest --jq .tag_name)
          SHIPPED=$(gh api "repos/ferdium/ferdium-app/contents/package.json?ref=$FERDIUM_TAG" --jq .content | base64 -d | jq -r .devDependencies.electron)
          npm view electron versions --json > versions.json
          export FERDIUM_TAG SHIPPED
          node > plan.json <<'EOF'
          const fs = require('fs');
          const parse = v => v.split('.').map(Number);
          const cmp = (a, b) => { const x = parse(a), y = parse(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
          const stable = JSON.parse(fs.readFileSync('versions.json')).filter(v => /^\d+\.\d+\.\d+$/.test(v)).sort(cmp);
          const shipped = process.env.SHIPPED, tag = process.env.FERDIUM_TAG;
          const S = parse(shipped)[0];                                  // major official Ferdium ships
          const M = Math.max(S, parseInt(process.env.ELECTRON_LINE || '0', 10)); // the build line
          const L = parse(stable[stable.length - 1])[0];
          const newest = major => stable.filter(v => parse(v)[0] === major).pop();
          const targets = [];
          const patch = newest(M);
          if (patch && (M > S || cmp(patch, shipped) > 0)) targets.push({ electron: patch, kind: 'patch' });
          if (L > M) targets.push({ electron: newest(L), kind: 'test' });
          for (const t of targets) {
            t.ferdium = tag;
            t.compat = parse(t.electron)[0] > S;
            t.tag = `ferdium-${tag}-electron-${t.electron}-npmfix${process.env.NPM_FIX_REV}`;
          }
          console.log(JSON.stringify({ shipped, S, M, L, targets }));
          EOF
          cat plan.json
          M=$(jq -r .M plan.json); L=$(jq -r .L plan.json)

          # Skip anything already released in this repo; TEST builds only once per Electron major
          RELEASED=$(gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName')
          FAILED=$(gh issue list --repo "$REPO" --state open --limit 1000 --json title --jq '.[].title | select(startswith("TEST build failed:"))')
          PATCH_FAILED=$(gh issue list --repo "$REPO" --state open --limit 1000 --json title --jq '.[].title | select(startswith("Build failed: "))')
          TARGETS='[]'
          for row in $(jq -c '.targets[]' plan.json); do
            t=$(jq -r .tag <<<"$row")
            kind=$(jq -r .kind <<<"$row")
            major=$(jq -r '.electron | split(".")[0]' <<<"$row")
            if [ "$CHECK_ONLY" = "true" ]; then
              # Check-only: run the normal build's checks even if already released; never TEST builds
              if [ "$kind" = "patch" ]; then
                echo "Check-only (no build, no publish): $t"
                TARGETS=$(jq -c --argjson r "$row" '. + [$r]' <<<"$TARGETS")
              fi
              continue
            fi
            if [ "$kind" = "test" ] && [ "$REBUILD_TEST" != "true" ] && grep -q -- "-electron-$major\." <<<"$RELEASED"; then
              echo "TEST build for Electron $major already exists, skipping: $t"
            elif [ "$kind" = "test" ] && [ "$REBUILD_TEST" != "true" ] && grep -q -- "+ Electron $major\." <<<"$FAILED"; then
              echo "TEST build for Electron $major already failed (see issue), skipping: $t"
            elif [ "$kind" = "patch" ] && grep -qx -- "Build failed: $t" <<<"$PATCH_FAILED"; then
              echo "Build already failed (see issue), skipping: $t"
            elif grep -qx -- "$t" <<<"$RELEASED"; then
              echo "Already built: $t"
            else
              echo "To build: $t"
              TARGETS=$(jq -c --argjson r "$row" '. + [$r]' <<<"$TARGETS")
            fi
          done
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "M=$M" >> "$GITHUB_ENV"
          echo "L=$L" >> "$GITHUB_ENV"

      - name: Warn when Ferdium's Electron major is near end of support
        shell: bash
        run: |
          set -euo pipefail
          # Electron supports its latest three stable majors.
          if [ "$M" -lt $((L - 2)) ]; then
            TITLE="Electron $M is no longer supported"
            BODY="Normal builds use Electron $M, but Electron now only patches $((L - 2))-$L. Patch builds have stopped; raise ELECTRON_LINE in the workflow or use the newest TEST build."
          elif [ "$M" -eq $((L - 2)) ]; then
            TITLE="Electron $M support ends when Electron $((L + 1)) ships"
            BODY="Normal builds use Electron $M, the oldest major Electron still patches. Dates: https://releases.electronjs.org/schedule"
          else
            exit 0
          fi
          if [ "$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq length)" = "0" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Keep the schedule alive
        # GitHub pauses schedules in public repos after 60 days without a commit.
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(gh api "repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          LAST=$(gh api "repos/$REPO/git/commits/$HEAD" --jq .committer.date)
          AGE_DAYS=$(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 ))
          echo "Last commit $AGE_DAYS days ago"
          if [ "$AGE_DAYS" -ge 45 ]; then
            TREE=$(gh api "repos/$REPO/git/commits/$HEAD" --jq .tree.sha)
            NEW=$(gh api "repos/$REPO/git/commits" -f message="keepalive: stop GitHub pausing the auto-build schedule" -f tree="$TREE" -f "parents[]=$HEAD" --jq .sha)
            gh api -X PATCH "repos/$REPO/git/refs/heads/$DEFAULT_BRANCH" -f sha="$NEW" >/dev/null
          fi

  build:
    needs: check
    if: needs.check.outputs.targets != '[]'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    name: 'Ferdium ${{ matrix.ferdium }} + Electron ${{ matrix.electron }} (${{ matrix.kind }})'
    env:
      GH_TOKEN: ${{ github.token }}
      CHECK_ONLY: ${{ github.event.inputs.check_only || 'false' }}
    steps:
      - name: Set env vars
        run: |
          echo "HOME=$USERPROFILE" >> $GITHUB_ENV
          echo "ELECTRON_CACHE=$USERPROFILE/.cache/electron" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_CACHE=$USERPROFILE/.cache/electron-builder" >> $GITHUB_ENV
        shell: bash
      - name: Checkout official Ferdium release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ferdium/ferdium-app
          ref: ${{ matrix.ferdium }}
          submodules: recursive
      - name: Use Node.js specified in the '.nvmrc' file
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Same workaround as Ferdium's own build (electron-builder issue 6933)
      - name: Tweak pnpm.cjs
        run: |
          PNPM_BASEDIR=$(dirname "$(echo "$PNPM_HOME" | sed -e 's/\\/\//g' -e 's/^\([A-Za-z]\):/\/\1/')")
          sed -i 's/\/usr\/bin\/env node/node/g' "$PNPM_BASEDIR/pnpm/bin/pnpm.cjs"
        shell: bash
      - name: Switch to Electron ${{ matrix.electron }}
        run: npm pkg set "devDependencies.electron=${{ matrix.electron }}"
        shell: bash
      # Ferdium's pinned node-abi may predate a new Electron major; electron-builder then fails
      # with "Could not detect abi". Builds on Ferdium's own major keep Ferdium's version.
      - name: Use newest node-abi (compat builds only)
        if: matrix.compat
        run: |
          V=$(npm view node-abi version)
          sed -i "/^overrides:/a\\  node-abi: $V" pnpm-workspace.yaml
          echo "node-abi override: $V"
        shell: bash
      # Electron 45 dropped 32-bit Windows; only the x64 installer is published anyway.
      - name: Build Windows x64 only (compat builds only)
        if: matrix.compat
        run: |
          sed -i 's/arch: \[x64, ia32, arm64\]/arch: [x64]/' electron-builder.yml
          grep -n "arch: \[x64\]" electron-builder.yml
        shell: bash
      # Patch/minor security updates for shipped npm packages (OSV audit, 2026-11-02).
      # pnpm matches "name@major" selectors by range overlap, so a dependent declaring "*" or ">=3"
      # is also captured; "Confirm no vulnerable version is left" fails on any unexpected major.
      # New releases must be 7 days old (supply-chain buffer), except Electron and node-abi.
      - name: Apply npm security overrides
        run: |
          set -euo pipefail
          grep -q '^minimumReleaseAge' pnpm-workspace.yaml || \
            printf '\nminimumReleaseAge: 10080\nminimumReleaseAgeExclude:\n  - electron\n  - node-abi\n' >> pnpm-workspace.yaml
          grep -q '^overrides:' pnpm-workspace.yaml || printf '\noverrides:\n' >> pnpm-workspace.yaml
          while read -r key ver; do
            [ -z "$key" ] && continue
            sed -i "/^overrides:/a\\  '$key': '^$ver'" pnpm-workspace.yaml
          done <<'LIST'
          proxy-addr@2 2.0.8
          brace-expansion@1 1.1.21
          brace-expansion@2 2.1.7
          immutable@4 4.3.9
          cross-spawn@6 6.0.6
          jws@3 3.2.3
          picomatch@2 2.3.2
          yaml@1 1.10.3
          darkreader@4 4.9.117
          js-yaml@4 4.3.2
          multiparty@4 4.3.0
          @remix-run/router@1 1.23.3
          builder-util-runtime@9 9.7.0
          lodash@4 4.18.0
          lodash-es@4 4.18.0
          validator@13 13.15.22
          @babel/runtime@7 7.26.10
          @octokit/request@8 8.4.1
          @octokit/request-error@5 5.1.1
          @sentry/browser@7 7.119.1
          moment@2 2.31.0
          qs@6 6.16.1
          serve-static@1 1.16.0
          tar@6 7.5.22
          minimatch@3 3.1.5
          minimatch@9 9.0.9
          decode-uri-component@0.2 0.2.2
          tmp@0.0 0.2.7
          tmp@0.2 0.2.7
          LIST
          sed -n '/^overrides:/,/^[^ ]/p' pnpm-workspace.yaml
        shell: bash
      - name: Install node dependencies
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          command: pnpm i --no-frozen-lockfile
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
      - name: Show node-abi in use
        run: grep -oE "node-abi@[0-9.]+" pnpm-lock.yaml | sort -u
        shell: bash
      - name: Confirm no vulnerable version is left
        run: |
          set -euo pipefail
          bad=0
          for old in proxy-addr@2.0.7 brace-expansion@1.1.11 brace-expansion@2.0.1 immutable@4.3.7 cross-spawn@6.0.5 \
                     jws@3.2.2 picomatch@2.3.1 yaml@1.10.2 darkreader@4.9.96 js-yaml@4.1.0 multiparty@4.2.3 \
                     @remix-run/router@1.17.1 builder-util-runtime@9.2.10 lodash@4.17.21 lodash-es@4.17.21 \
                     validator@13.12.0 @babel/runtime@7.23.5 @babel/runtime@7.23.9 @babel/runtime@7.24.4 \
                     @octokit/request@8.1.6 @octokit/request-error@5.0.1 @sentry/browser@7.74.0 moment@2.30.1 \
                     qs@6.11.0 serve-static@1.15.0 tar@6.2.1 minimatch@3.1.2 minimatch@9.0.3 minimatch@9.0.4 \
                     decode-uri-component@0.2.0 tmp@0.0.33 tmp@0.2.1; do
            if grep -qE "^  '?${old//./\\.}'?:" pnpm-lock.yaml; then echo "STILL PRESENT: $old"; bad=1; fi
          done
          # Overrides may only move a package within the majors it already had (tar may go 6 -> 7)
          git show HEAD:pnpm-lock.yaml > "$RUNNER_TEMP/lock.orig.yaml"
          majors() { grep -oE "^  '?${1//./\\.}@[0-9]+" "$2" | sed -E 's/.*@//' | sort -u | tr '\n' ' '; }
          for p in proxy-addr brace-expansion immutable cross-spawn jws picomatch yaml darkreader js-yaml multiparty \
                   @remix-run/router builder-util-runtime lodash lodash-es validator @babel/runtime @octokit/request \
                   @octokit/request-error @sentry/browser moment qs serve-static tar minimatch decode-uri-component tmp; do
            allowed=" $(majors "$p" "$RUNNER_TEMP/lock.orig.yaml") "
            [ "$p" = tar ] && allowed="$allowed 7 "
            for m in $(majors "$p" pnpm-lock.yaml); do
              case "$allowed" in *" $m "*) ;; *) echo "UNEXPECTED MAJOR: $p@$m (allowed:$allowed)"; bad=1 ;; esac
            done
          done
          for p in proxy-addr brace-expansion immutable cross-spawn jws picomatch yaml darkreader js-yaml multiparty \
                   @remix-run/router builder-util-runtime lodash lodash-es validator @babel/runtime @octokit/request \
                   @octokit/request-error @sentry/browser moment qs serve-static tar minimatch \
                   decode-uri-component tmp; do
            echo "$p: $(grep -oE "^  '?${p//./\\.}@[0-9][^':(]*" pnpm-lock.yaml | sed -E "s/^  '?//" | sort -u | tr '\n' ' ')"
          done
          exit $bad
        shell: bash
      - name: Package recipes
        run: |
          pnpm i
          pnpm lint
          pnpm reformat-files
          pnpm package
        working-directory: ./recipes
        shell: bash
      - name: Run linter and tests
        run: |
          pnpm lint
          pnpm test
        shell: bash
      # This repository's patch files, at the exact commit this run uses (no separate download).
      - name: Checkout this repository's patches
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .fork-patches
          sparse-checkout: .github/patches
      # Applied after lint/tests so Ferdium's ESLint rules only judge Ferdium's own code.
      - name: Patch clipboard for Electron 44+ (compat builds only)
        if: matrix.compat
        run: |
          set -euo pipefail
          ELECTRON="${{ matrix.electron }}"; F=src/electron/ipc-api/clipboard.ts
          if [ "${ELECTRON%%.*}" -ge 44 ] && grep -q "clipboard.writeImage" "$F"; then
            cp .fork-patches/.github/patches/electron44-clipboard.ts "$F"
            grep -q "new ClipboardItem" "$F"
            echo "Patched $F for the Electron 44+ clipboard API"
          else
            echo "No clipboard patch needed"
          fi
        shell: bash
      # Applied after lint/tests, like the clipboard patch. Needed on every build because the
      # overrides force tar 7, which has no default export.
      - name: Apply Ferdium hardening patches
        run: |
          set -euo pipefail
          PATCHES=.fork-patches/.github/patches
          # 1) tar 7: namespace import instead of the (missing) default export
          F=src/api/server/ServerApi.ts
          sed -i "s/^import tar from 'tar';/import * as tar from 'tar';/" "$F"
          if grep -q "^import tar from 'tar'" "$F"; then echo "tar default import still present"; exit 1; fi
          grep -n "from 'tar'" "$F"
          # 2) recipe archives may not write outside their folder
          sed -i 's/preservePaths: true,/preservePaths: false,/' "$F"
          if grep -q "preservePaths: true" "$F"; then echo "preservePaths still true"; exit 1; fi
          # 3) local server: token check before body parsing and routing
          IS=src/internal-server
          cp "$PATCHES/internal-server-RequireLocalToken.js" $IS/app/Middleware/RequireLocalToken.js
          sed -i "s#^const serverMiddleware = \['Adonis/Middleware/Static'\];#const serverMiddleware = ['App/Middleware/RequireLocalToken', 'Adonis/Middleware/Static'];#" $IS/start/kernel.js
          grep -n "App/Middleware/RequireLocalToken" $IS/start/kernel.js
          # Real-framework test: boot AdonisJS from node_modules with the patched kernel, body-parser
          # config and middleware; fail if any request without a valid token reaches the body parser.
          T=.ci-adonis-test
          rm -rf $T && cp -r "$PATCHES/adonis-test/approot" $T
          cp $IS/app/Middleware/RequireLocalToken.js $T/app/Middleware/
          cp $IS/config/bodyParser.js $T/config/
          cp -r $IS/public $T/public
          cp $IS/start/kernel.js $T/start/kernel.js
          sed -i "s#'Adonis/Middleware/BodyParser',#'Adonis/Middleware/BodyParser',\n  'App/Middleware/Probe',#" $T/start/kernel.js
          grep -q "App/Middleware/Probe" $T/start/kernel.js
          ADONIS_DEPS="$GITHUB_WORKSPACE" node "$PATCHES/adonis-test/run.js" $T
          rm -rf $T .fork-patches
        shell: bash
      - name: Type-check against Electron ${{ matrix.electron }} (compat builds only, informational)
        if: matrix.compat
        continue-on-error: true
        # --pretty false and colour stripping keep "error TSnnnn" greppable; if tsc fails without
        # any TSnnnn lines, the log tail is printed so the failure is never reported as "0 errors".
        run: |
          set +e
          pnpm typecheck --pretty false > typecheck.log 2>&1
          code=$?
          sed -i -E 's/\x1b\[[0-9;]*[A-Za-z]//g' typecheck.log
          n=$(grep -cE 'error TS[0-9]+' typecheck.log)
          echo "tsc exit code: $code | TypeScript errors: $n"
          echo "--- errors per file:"
          grep -E 'error TS[0-9]+' typecheck.log | sed -E 's/\(([0-9]+),[0-9]+\): error.*//' | sort | uniq -c | sort -rn | head -40
          echo "--- errors:"
          grep -E 'error TS[0-9]+' typecheck.log | head -150
          if [ "$code" -ne 0 ] && [ "$n" -eq 0 ]; then echo "--- tsc failed without TSnnnn lines; last 80 log lines:"; tail -80 typecheck.log; fi
          exit $code
        shell: bash
      - name: Build Ferdium
        if: env.CHECK_ONLY != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm build --publish never
        shell: bash
      - name: Confirm the packaged Electron version
        if: env.CHECK_ONLY != 'true'
        shell: pwsh
        run: |
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('out\win-unpacked\Ferdium.exe'))
          $found = [regex]::Matches($txt, 'Electron/(\d+\.\d+\.\d+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          "Packaged Electron: $found"
          if ($found -ne '${{ matrix.electron }}') { throw "Expected Electron ${{ matrix.electron }}, found $found" }
      - name: Publish release
        if: env.CHECK_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FERDIUM="${{ matrix.ferdium }}"; ELECTRON="${{ matrix.electron }}"
          if [ "${{ matrix.kind }}" = "test" ]; then
            TITLE="TEST - Ferdium ${FERDIUM#v} + Electron $ELECTRON"
            FLAGS="--prerelease"
            NOTE="TEST build: Electron $ELECTRON is a newer major version than official Ferdium ${FERDIUM#v} was built for. Some services may break. Try it before relying on it. Back up your Ferdium profile first: Chromium upgrades it, and an older build may not read it afterwards. On Electron 44+ the clipboard handler is patched for the new clipboard API."
          else
            TITLE="Ferdium ${FERDIUM#v} + Electron $ELECTRON + npm fixes r$NPM_FIX_REV"
            FLAGS="--latest"
            if [ "${{ matrix.compat }}" = "true" ]; then
              NOTE="Official Ferdium ${FERDIUM#v} source on Electron $ELECTRON, the newest patch of this repository's Electron line (a newer major than official Ferdium ships, with the Electron 44+ clipboard patch). Do not install a build on an older Electron major over this profile."
            else
              NOTE="Official Ferdium ${FERDIUM#v} source with Electron updated to $ELECTRON (security and bug-fix patch of the same major version)."
            fi
          fi
          printf '%s\n\nAlso forces security updates of shipped npm packages (override list r%s in the workflow, including tar 7; new releases must be 7 days old) and applies three hardening patches: tar 7 import, recipe unpacking without preservePaths, and a local-server token check that rejects requests before body parsing. Ferdium'"'"'s lint and tests passed on the unpatched source; the patched local server passed a real AdonisJS test (no request without the token reaches the body parser).\n\nStill open (not fixable without a newer AdonisJS): bodyparser 2.3.0, lucid 6.3.0, knex 0.21.21 and path-to-regexp 2.4.0 advisories, now reachable only with the local token; decode-uri-component CVE-2026-118664 (build tooling, no CommonJS fix); minimatch moderate advisory (fixed only in 11.x).\n\nInstall: download Ferdium-win-AutoSetup-*-x64.exe and run it. The build is unsigned, so at the SmartScreen warning click More info, then Run anyway.\n\nBuilt from https://github.com/ferdium/ferdium-app/tree/%s; only the Electron version, those npm package versions and the patches listed in the workflow changed.\n' "$NOTE" "$NPM_FIX_REV" "$FERDIUM" > notes.md
          gh release create "${{ matrix.tag }}" out/Ferdium-win-AutoSetup-*-x64.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "$TITLE" --notes-file notes.md $FLAGS
      - name: Open an issue for a failed TEST build
        if: failure() && matrix.kind == 'test' && env.CHECK_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FERDIUM="${{ matrix.ferdium }}"; ELECTRON="${{ matrix.electron }}"; MAJOR="${ELECTRON%%.*}"
          TITLE="TEST build failed: Ferdium ${FERDIUM#v} + Electron $ELECTRON"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'The TEST build of Ferdium %s on Electron %s failed, so no TEST release was published.\n\nElectron %s will not be TEST-built again while this issue is open. Close it to allow a retry.\n\nBuild log: %s\n' "${FERDIUM#v}" "$ELECTRON" "$MAJOR" "$RUN_URL" > issue.md
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file issue.md
      - name: Open an issue for a failed normal build
        if: failure() && matrix.kind == 'patch' && env.CHECK_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'The normal build %s failed, so no release was published. A likely cause is one of the forced npm security updates.\n\nThis exact build will not be retried while this issue is open. Close it to allow a retry.\n\nBuild log: %s\n' "${{ matrix.tag }}" "$RUN_URL" > issue.md
          gh issue create --repo "${{ github.repository }}" --title "Build failed: ${{ matrix.tag }}" --body-file issue.md
